# BMP Boost LED Extender の3色LED を rgbled-widget に任せる。
#
# これだけで、起動のたびに
#   1. バッテリー残量を色で点滅 (緑 / 黄 / 赤)
#   2. そのあと BLE の接続状態を点滅 (青=接続 / 黄=アドバタイズ / 赤=切断)
# が出る。まず光るかどうかを見るのはこれで足りる。
CONFIG_RGBLED_WIDGET=y

# ── ★central 側にだけ入れること ──
# LED が載っていない側でこれを有効にすると led-red エイリアスが無くて落ちる。
# また表示内容の多くは central 専用:
#   相方の電池残量 / BLEプロファイル状態 / レイヤー色 → central のみ
#   自分の電池残量 / 接続・切断              → peripheral でも出る

# ── まだ入れていないもの ──
# レイヤー色。非ベースレイヤーにいる間 LED が点きっぱなしになるため、
# 乾電池運用での消費を見てから決める。レイヤーは13個あるので割り当ても要検討。
# CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
# CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=4    # 4=BLUE → エイリアスのずれで緑が光る

# ── 既存の status_led との関係 ──
# torabo_tsuki_lp.dtsi の status_led (&bmp 2) と CONFIG_ZMK_STATUS_LED=y は
# 別 GPIO・別モジュールなので衝突しない。表示が二重になるだけ。
# うるさければ shield の .conf で CONFIG_ZMK_STATUS_LED=n にする。

# ── 上流との差分 ──
# 上流の led-plus.conf は CONFIG_IQS7211E=n / ..._SCROLLER_INERTIA=n も
# 書いているが、こちらはドライバの有効化をトラックパッド側のスニペットで
# 制御しているため入れない。同時指定すると打ち消し合う。
