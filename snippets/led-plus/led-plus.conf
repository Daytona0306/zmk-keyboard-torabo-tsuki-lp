# BMP Boost LED Extender の3色LED を rgbled-widget に任せる。
#
# これだけで、起動のたびに
#   1. バッテリー残量を色で点滅 (緑 / 黄 / 赤)
#   2. そのあと BLE の接続状態を点滅 (青=接続 / 黄=アドバタイズ / 赤=切断)
# が出る。まず光るかどうかを見るのはこれで足りる。
CONFIG_RGBLED_WIDGET=y

# ── ★central 側にだけ入れること ──
# LED が載っていない側でこれを有効にすると led-red エイリアスが無くて落ちる。
# また表示内容の多くは central 専用:
#   相方の電池残量 / BLEプロファイル状態 / レイヤー色 → central のみ
#   自分の電池残量 / 接続・切断              → peripheral でも出る

# ── レイヤー色 ──
# そのレイヤーが最上位で有効な間、LED が点きっぱなしになる。
# モジュールはレイヤー 1〜7 に既定色を持ち、8 以降は BLACK (消灯)。
# 既定のままでうちの構成にほぼ合うので、触るのは 1 番だけにしてある。
#
#  #  レイヤー          設定      点く LED      見える色
#  0  Base            BLACK     —            消灯
#  1  iPad            → 0       —            消灯  ★下記
#  2  NUM/SYM1        GREEN     黄            黄
#  3  SYM2            YELLOW    赤 + 黄       オレンジ
#  4  Mouse           BLUE      緑            緑
#  5  Scroll          MAGENTA   赤 + 緑       赤緑の混合
#  6  Bluetooth       CYAN      黄 + 緑       黄緑
#  7  Gest: Arrow     WHITE     赤 + 黄 + 緑  白っぽい
#  8〜12 Gest: 他      BLACK     —            消灯
#
# 色番号は RGB のビット。BLACK=0 RED=1 GREEN=2 YELLOW=3 BLUE=4
# MAGENTA=5 CYAN=6 WHITE=7。overlay のエイリアスがずれているので、
# red→赤 / green→黄 / blue→緑 と読み替えること。
# はっきり区別できるのは 0 (消灯) / 1 (赤) / 2 (黄) / 4 (緑) の4つだけ。
# 1.6mm の3in1パッケージなので混色 (3・5・6・7) の判別は期待しないこと。
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y

# ★iPad (1) だけ消灯にしている。
# 他のレイヤーは押している間だけだが、iPad は OS 判定で既定レイヤーになる。
# 既定色 RED のままだと iPad を使っている間ずっと赤が点灯し、
# 乾電池運用では無視できない。状態ではなく常駐なので消しておく。
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=0

# SHOW_LAYER_CHANGE (レイヤー番号の回数だけ点滅する方式) は採らない。
# レイヤーが13個あり、12番なら12回点滅することになる。

# ── 既存の status_led との関係 ──
# torabo_tsuki_lp.dtsi の status_led (&bmp 2) と CONFIG_ZMK_STATUS_LED=y は
# 別 GPIO・別モジュールなので衝突しない。表示が二重になるだけ。
# うるさければ shield の .conf で CONFIG_ZMK_STATUS_LED=n にする。

# ── 上流との差分 ──
# 上流の led-plus.conf は CONFIG_IQS7211E=n / ..._SCROLLER_INERTIA=n も
# 書いているが、こちらはドライバの有効化をトラックパッド側のスニペットで
# 制御しているため入れない。同時指定すると打ち消し合う。
