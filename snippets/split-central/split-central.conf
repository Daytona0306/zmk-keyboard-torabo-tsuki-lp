CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# =========================================================
# Section: スムーススクロール
# =========================================================
# HID の Resolution Multiplier を使い、ホストに「1ノッチを細かく分割して
# 送れる」と申告する。対応ホストなら1行ぶんずつカクッと動くのではなく
# 連続的にスクロールする。Kconfig は central 側にしか存在しない
# (app/src/pointing/Kconfig の `if !ZMK_SPLIT || ZMK_SPLIT_ROLE_CENTRAL`)。
#
# ★焼いた直後はスクロールが遅くなる。これは想定どおり★
#
# ZMK 側の実装 (app/src/pointing/input_listener.c の
# apply_resolution_scaling) は、割る数 div を出して scaled まで計算して
# おきながら、最後に
#     evt->value = val;      // ← scaled ではない
# としていて、割った結果を捨てている。本家 zmkfirmware/zmk の main も
# 同じコードなので、フォーク固有ではない。
#
# つまり ZMK は値をそのまま流し、ホスト側だけが「1カウント = 1/N ノッチ」
# として解釈する。結果としてスクロール量がネゴシエートされた倍率ぶん
# (最大16分の1) 小さくなる。
#
# ★詰め方: 焼き直さずに DYA Studio のスクロール倍率で上げる★
# scroll_runtime_input_processor がリスナーのチェーンに入っていて
# (torabo_tsuki_lp_right.overlay)、CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC
# で Studio から実行時に変えられる。値はリポジトリには残らない。
#
# ★注意: HID レポートマップが変わる★
# Feature レポートが1つ増えるので、ペアリング済みのホストとは
# 再ペアリングが必要になることがある。接続が変になったら
# settings_reset を焼いてペアリングし直すこと。
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# DYA Studio の設定永続化レイヤ。runtime-* 系がこの上に乗る。
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
# ZMK_RUNTIME_MACRO_MAX_BYTES の範囲は
#   [ZMK_CUSTOM_SETTINGS_VALUE_MAX_SIZE, ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE]
# で決まる。LARGE 側は既定が VALUE 側と同じ 64 なので、そのままだと範囲が
# [64, 64] になり MAX_BYTES=256 が弾かれる (ZMK は Kconfig 警告をエラー扱い)。
# VALUE 側は protobuf スキーマ有効時 64 に固定されるため、LARGE 側を上げる。
# 上げても全設定が肥大するわけではなく、大きな max_size で登録された設定と
# チャンク用のステージングバッファのみが増える。
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# =========================================================
# DYA Studio の機能 (central 側でのみ RPC が動く)
# =========================================================

# ── マクロ / コンボのランタイム編集 ──
# https://github.com/cormoran/zmk-feature-runtime-combo
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
# スロット数。1スロットあたり RAM 約64バイト
CONFIG_ZMK_RUNTIME_COMBO_MAX_COMBOS=16
# 既存の zmk,combos の既定 (50ms) に合わせる
CONFIG_ZMK_RUNTIME_COMBO_DEFAULT_TIMEOUT_MS=50

# https://github.com/cormoran/zmk-feature-runtime-macro
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
# ランタイムマクロは behavior local ID で束縛を保存するため CRC16 が必要
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_RUNTIME_MACRO_COUNT=8
CONFIG_ZMK_RUNTIME_MACRO_POOL_BYTES=1024
CONFIG_ZMK_RUNTIME_MACRO_MAX_BYTES=256

# ── hold-tap ランタイム調整 (Phase2a: RAMのみ、central側のみ) ──
# https://github.com/Daytona0306/zmk-feature-holdtap-config
CONFIG_ZMK_HOLDTAP_RUNTIME=y

# ── 診断タブ ──
# キースイッチ (押下統計・チャタリング検出)
# torabo-tsuki LP は 66 ポジションなので既定の 128 から縮める
# (1ポジションあたり約28バイト)
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=72

# キースイッチ診断のライブ表示
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y

# 安定性 (フリーズ・ハードフォルト・予期しないリセットを Flash に記録)
# NOTE: FREEZE_DETECT はシステムワークキューが 10 秒以上詰まると
#       インシデントを記録して再起動する (既定で有効)。
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y

# デバイス情報
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y

# スタック使用量
CONFIG_ZMK_DEVTOOL=y
CONFIG_ZMK_DEVTOOL_STUDIO_RPC=y
CONFIG_ZMK_DEVTOOL_STACK_USAGE=y
# ログキャプチャは RAM を数KB消費するので既定では無効
# CONFIG_ZMK_DEVTOOL_LOG_CAPTURE=y

# Zephyr settings の閲覧
CONFIG_ZMK_SETTING_EXPOSE=y

# Studio RPC の性能計測
CONFIG_ZMK_STUDIO_RPC_PERF=y
CONFIG_ZMK_STUDIO_RPC_PERF_HANDLER=y

# ── Studio RPC のバッファとスタック ──
# カスタム RPC サブシステムを増やしたことへの対応。
# 2048 バイトのバッファは nRF52840 でキーマップ読み込みが固まる事例があるため
# 512 に抑える。
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=512
# 大きな通知ボディをエンコードする際のスタックオーバーフロー対策
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000

# ── マウスジェスチャーの RPC 編集 ──
# https://github.com/shakushakupanda/zmk-module-mouse-gesture-rpc
# gestures.dtsi の6セットとは独立。RPC 側は DT インスタンス0番 (mg) のみを使う。
CONFIG_ZMK_MOUSE_GESTURE_RPC=y
# セット数は 1..16、保存できるジェスチャー総数は最大32 (proto 由来の上限)
CONFIG_ZMK_MOUSE_GESTURE_RPC_NUM_SETS=5

# ── 接続先 / OS ごとのデフォルトレイヤー ──
# https://github.com/cormoran/zmk-feature-default-layer
# USB / BLE プロファイルごと、および検出した OS ごとに、常時 ON の
# ベースレイヤーを切り替える。設定は DYA Studio のパネルから行う。
CONFIG_ZMK_DEFAULT_LAYER=y
# MIN/MAX は「パネルの選択肢」ではなく、レイヤー切替時に強制 deactivate
# する範囲 (src/default_layer.c の apply_layer)。パネルの選択肢は RPC の
# layer_count = 全レイヤー数から作られるので、ここを絞っても 0 は選べる。
# 1 (iPad) のみにしておくと、モーメンタリなレイヤー 2..12 が切替の巻き添えで
# 落とされることがなくなる。Windows 側は「未設定」= 常時 ON の 0 のまま。
CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=1
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=1
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y

# ── OS 判定 ──
# https://github.com/cormoran/zmk-feature-os-detection
# 上の OS 連動に必要。単体でも Studio から判定結果を確認できるので、
# BLE 接続が不安定なときの切り分けに使える。
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y
# USB 側の OS 判定。
#
# 一時期 =n にしていたが戻した。**このシンボルは DYA Studio の USB 接続不良の
# 原因ではない** (=n でも同じ症状が出ることを確認済み)。=n にしていたのは
# 「原因だから」ではなく、USB 周りを切り分けている間に変数を1つ減らすためで、
# その切り分け自体を打ち切ったので理由が消えた。
# 経緯は README「ZMK_OS_DETECTION_USB は USB の列挙経路を変える」を見ること。
#
# ただし副作用は実在する。CONFIG_USB_DEVICE_BOS を select し、USB デバイス
# 記述子の bcdUSB を 2.00 から 2.01 へ上げるので、host が
# GET_DESCRIPTOR(BOS) を読みに来るようになり列挙経路が変わる。
# モジュール側に「Windows がデバイスを認識しなくなった (macOS/Linux は無事)」
# という記録があり、その修正は取り込み済みの main (3052679) に入っている。
# USB でキーボードが認識されなくなったら、真っ先にここを疑うこと。
CONFIG_ZMK_OS_DETECTION_USB=y
# NOTE: os-detection 自身の CONFIG_ZMK_OS_DETECTION_LAYER_* による自動切替は
#       default-layer モジュールと競合するので絶対に有効にしないこと。
