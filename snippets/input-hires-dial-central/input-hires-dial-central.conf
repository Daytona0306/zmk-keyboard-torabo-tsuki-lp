# ダイヤルの behavior 一式。センサー本体 (I2C) は相方側にあるが、
# sekigon,remote-hires-dial と behavior はこのシンボルで入る。
CONFIG_ZMK_HIRES_DIAL=y

# 標準のホイール入力 (&hires_dial_scroll / &hires_dial_hscroll)。
# CONFIG_ZMK_POINTING に依存する。スムーススクロール
# (CONFIG_ZMK_POINTING_SMOOTH_SCROLLING) とも併用できる。
CONFIG_ZMK_HIRES_DIAL_SCROLL=y

# ★Radial Controller (Surface Dial) は、いまの ZMK では有効にできない★
#
#   CONFIG_ZMK_HIRES_DIAL_RADIAL_CONTROLLER=y
#
# を立てるとビルドが落ちる:
#
#   zmk-driver-hires-dial/src/radial_controller/endpoints.c:12:45:
#   error: invalid initializer
#
# 原因は関数名が1つずれていること。ドライバは本家 ZMK の
#     struct zmk_endpoint_instance endpoint = zmk_endpoints_selected();
# を呼ぶが、こちらが使っている cormoran/zmk (main+dya) では同じ関数が
#     struct zmk_endpoint_instance zmk_endpoint_get_selected(void);
# に改名されている (app/include/zmk/endpoints.h:88)。宣言が無いので
# 暗黙宣言 = int 扱いになり、構造体の初期化子として弾かれる。
# 暗黙宣言のまま -Wfatal-errors で最初のエラーで止まっている。
#
# ★ずれているのはこの1シンボルだけ★ ドライバが呼ぶ ZMK の関数は
# これ1つで、残りはドライバ自身のもの。直すなら1行。
#   - ドライバを fork して endpoints.c の呼び出しを差し替え、
#     config/west.yml の remote をそちらへ向ける
#   - または本家へ上げて取り込まれるのを待つ
#
# 無効のままでも DT とキーマップはそのままでよい。behavior は
#   behavior_hires_dial_radial_controller.c:57
#   behavior_hires_dial_radial_controller_button.c:16
# に #if ガードがあり、無効時は入力を捨てるだけの no-op になる。
# ダイヤルはエンコーダとホイールとしては動く。
#
# 有効にできたときの注意: USB では HID インタフェースが1本増え
# (USB_HID_DEVICE_COUNT が 2 になる)、BLE では HID レポートマップが
# 変わるため、★ペアリング済みのホストとは再ペアリングが必要になる
# ことがある★ とドライバ README にある。
# CONFIG_ZMK_HIRES_DIAL_RADIAL_CONTROLLER=y
