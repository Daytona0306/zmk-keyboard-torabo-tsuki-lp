# ダイヤルの behavior 一式。センサー本体 (I2C) は相方側にあるが、
# sekigon,remote-hires-dial と behavior はこのシンボルで入る。
CONFIG_ZMK_HIRES_DIAL=y

# 標準のホイール入力 (&hires_dial_scroll / &hires_dial_hscroll)。
# CONFIG_ZMK_POINTING に依存する。スムーススクロール
# (CONFIG_ZMK_POINTING_SMOOTH_SCROLLING) とも併用できる。
CONFIG_ZMK_HIRES_DIAL_SCROLL=y

# Windows の Radial Controller (Surface Dial) として振る舞う。
#
# ★これを通すために zmk-driver-hires-dial は fork を引いている★
# 上流は ZMK v0.3 前提で zmk_endpoints_selected() を呼ぶが、本家 ZMK の
# #3140 (2026-02-12) で zmk_endpoint_get_selected() へ改名されており、
# v0.4 系のこちらでは
#   src/radial_controller/endpoints.c:12:45: error: invalid initializer
# で落ちる。fork でその1行だけ直してある。
# 詳しくは config/west.yml のコメントと tools/hires-dial-zmk-main.patch。
#
# 副作用: USB では HID インタフェースが1本増える
#   config USB_HID_DEVICE_COUNT / default 2 if ... && ZMK_USB
# BLE ではレポートマップが変わるため、
# ★ペアリング済みのホストとは再ペアリングが必要になることがある★
# (ドライバ README に明記あり)。接続が変になったら、まずここを疑うこと。
CONFIG_ZMK_HIRES_DIAL_RADIAL_CONTROLLER=y
