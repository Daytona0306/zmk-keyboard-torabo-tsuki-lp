# ダイヤル本体 (PAT912x センサー + エンコーダ behavior)。
# CONFIG_SENSOR は zmk,keymap-sensors ノードがあれば ZMK 側が select する。
CONFIG_ZMK_HIRES_DIAL=y

# ★スクロール / Radial Controller は central 側のスニペットで有効にする。
#
#   CONFIG_ZMK_HIRES_DIAL_SCROLL=y
#   CONFIG_ZMK_HIRES_DIAL_RADIAL_CONTROLLER=y
#
# ここで有効にしていないのは、このスニペットを peripheral 側で使うため。
# behavior のソースは
#   if((NOT CONFIG_ZMK_SPLIT) OR CONFIG_ZMK_SPLIT_ROLE_CENTRAL)
# で囲われていて peripheral 側には入らないので、有効にしても効果が無い。
# それどころか RADIAL_CONTROLLER は
#   config USB_HID_DEVICE_COUNT / default 2 if ... && ZMK_USB
# で USB HID インタフェースを1本増やすため、peripheral 側の USB 列挙を
# 無駄に変えてしまう。
#
# ダイヤルを central 側 (または非スプリット) に付けるときは、
# このファイルに上の2行を足すこと。
