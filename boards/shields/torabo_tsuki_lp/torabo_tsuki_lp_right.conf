# =========================================================
# Section: ZMK Studio
# =========================================================
CONFIG_ZMK_STUDIO=y
# Studio のロック。既定 (y) のまま使う。
#
# 守れる範囲は README の「Studio のロックはキーマップしか守らない」を見ること。
# 要点だけ:
#   - ロックが弾くのは SECURED と宣言されたハンドラだけ (app/src/studio/rpc.c:46)。
#     ZMK 本体のキーマップ系は12個すべて SECURED なので、キーマップは守られる。
#   - DYA Studio のカスタム RPC は pmw3610 と kscan-diagnostics 以外 UNSECURED。
#   - 書き込みはどのモジュールも SECURE なので、ロック中に改変はされない。
#   - 読み出しは通る。とくにマクロ本体は custom-settings のキースペース
#     runtime_macros (read 権限 UNSECURE) に置かれており、runtime-macro 側の
#     自前ゲートを迂回して読める。
#     塞ぐには CONFIG_ZMK_STUDIO_TRANSPORT_BLE=n で物理アクセスを必須にする。
#
# 一度 n にしたが戻した。判断の前提だった「有線でしか使わない」が
# 成り立っていない (Studio の BLE トランスポートが既定で有効)。
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_SETTINGS_RPC=y

# =========================================================
# Section: Connectivity & Stability (接続・通信)
# =========================================================
# ペアリング上限・接続上限（5台）
CONFIG_BT_MAX_PAIRED=6
CONFIG_BT_MAX_CONN=6

# 出力強度の調整
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Bluetoothの接続管理を細かく行う
CONFIG_ZMK_BLE_MANAGEMENT=y

# 通信安定化の独自設定（1Mbps固定・干渉への耐性強化）
# 長時間使用後に接続が切れる事象への対策。
#  - ENFORCE_SUBSCRIPTION=n : 再接続時にホストがCCC購読を復元しない場合に
#    「繋がっているのに入力が通らない」状態になるのを避ける（Windowsで既知）
#  - PHY_2M=n : 1Mbps固定。オフィスの2.4GHz混雑下では2M PHYより安定する
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# =========================================================
# Section: Split Keyboard (分割キーボード専用設定)
# =========================================================
# セントラル側のメモリ割り当てを増やしクラッシュを防止
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768
# 左右間でイベントを正確にリレーする
CONFIG_ZMK_SPLIT_RELAY_EVENT=y

# キースイッチ診断で peripheral 側の統計も取得するための中継。
# 左右で同じ値を設定する必要がある。
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256

# =========================================================
# Section: Battery & Power Management
# =========================================================
# バッテリー残量の同期・履歴・USB接続時の挙動
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# 特殊な電池（乾電池やニッケル水素等）用の電圧閾値
CONFIG_ZMK_NON_LIPO_MIN_MV=1000
CONFIG_ZMK_NON_LIPO_LOW_MV=900

# スリープのタイムアウト（有効化）
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=9000000

# =========================================================
# Section: System & Input Performance
# =========================================================
# チャタリング防止と応答速度の高速化（維持）
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# 設定の保存頻度を減らし、フラッシュメモリの寿命を延ばす（追加）
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# その他システム必須設定
CONFIG_ZMK_CDC_ACM_BOOTLOADER_TRIGGER=y
CONFIG_ZMK_STATUS_LED=y
