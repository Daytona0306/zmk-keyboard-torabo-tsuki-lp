# ===========================================================================
#  ★このファイルは update-modules ブランチ専用の「浮動」版です★
#
#  revision が SHA ではなくブランチ名になっています。west update のたびに
#  上流の先頭を引くので、ビルドの再現性がありません。
#
#  ★このブランチを main にマージしないこと。★
#  main は SHA 固定でなければなりません（理由は README「なぜ main を固定
#  するのか」。過去に浮動のまま上流の破壊的変更を食らってビルドが落ちた
#  ことがあります）。
#
#  使い方
#    1. main から作り直す
#         git checkout -B update-modules main
#         tools/west-pins.py --unpin
#    2. push して CI を見る
#    3. 緑なら main 側で tools/west-pins.py を実行して SHA を進める
#       （main に持っていくのは「新しい SHA」であって、この浮動版ではない）
#    4. 赤ならどのモジュールが壊したかを調べる。それがこのブランチの仕事
#
#  tools/west-pins.py --check なら、固定したまま「上流が進んでいるか」
#  だけを見られます。
# ===========================================================================
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: sekigon-gonnoc
      url-base: https://github.com/sekigon-gonnoc
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: kot149
      url-base: https://github.com/kot149
    - name: ssbb
      url-base: https://github.com/ssbb
    - name: mjmjm0101
      url-base: https://github.com/mjmjm0101
    - name: shakushakupanda
      url-base: https://github.com/shakushakupanda
    - name: caksoylar
      url-base: https://github.com/caksoylar
    # 自分の fork 置き場。上流が ZMK v0.3 前提のままなので、
    # v0.4 系に合わせた最小パッチを当てたものをここから引く。
    - name: Daytona0306
      url-base: https://github.com/Daytona0306
  projects:
    # ── ZMK 本体 ────────────────────────────────────────────────
    # DYA Studio 向け。main+dya は main+custom-studio-protocol を含み、
    # ランタイムマクロ / ランタイムコンボ等はこの custom RPC が前提。
    # ベースは ZMK v0.4 系 (Zephyr 4.1 / HWMv2)。
    # 旧 v0.3-branch+dya は Zephyr 3.5 だったのでメジャー更新にあたる。
    - name: zmk
      remote: cormoran
      revision: main+dya
      import: app/west.yml

    # ── ボード ──────────────────────────────────────────────────
    # v0.2 ブランチは HWMv1 (board.yml 無し) で Zephyr 4.1 では使えない。
    # master が HWMv2 対応 (board.yml あり) なのでこちらを使う。
    - name: zmk-component-bmp-boost
      remote: sekigon-gonnoc
      revision: master
      import: west.yml

    # ── sekigon 系モジュール (v0.2 ブランチは旧線なので main へ) ──
    - name: zmk-feature-status-led
      remote: sekigon-gonnoc
      revision: main
    # torabo-tsuki ブランチは main + torabo 向け調整1コミット。
    # main 側は 2026-02 から進んでいないため調整入りを維持する。
    - name: zmk-driver-paw3222
      remote: sekigon-gonnoc
      revision: torabo-tsuki
    # トラックパッド (Azoteq IQS7211E)。snippets/input-trackpad{,-mini} が使う。
    # revision 無指定だと west の既定 master になるため本家と同じ挙動。
    # CONFIG_IQS7211E は既定 n (menuconfig / default 無し) で、
    # CMakeLists も if(CONFIG_IQS7211E) で囲われているため、
    # スニペットを指定しない限りビルドには一切入らない。
    - name: zmk-driver-iqs7211e
      remote: sekigon-gonnoc
      revision: master
    # 高分解能ダイヤル (PAT912x, I2C 0x75)。snippets/input-hires-dial{,-central} が使う。
    # CONFIG_ZMK_HIRES_DIAL は既定 n (menuconfig) で、CMakeLists も
    # zephyr_library_sources_ifdef で囲われているため、スニペットを
    # 指定しない限りビルドには一切入らない。
    #
    # ★このモジュールは dts_root: . を持つ。つまり
    #   dts/behaviors/hires_dial.dtsi と dts/bindings/ が
    #   west.yml に載っているだけで全ビルドのインクルードパスに乗る。
    #   behaviors 側は /omit-if-no-ref/ なので参照しなければ消える。
    #
    # ★fork を引いている★ 上流 (sekigon-gonnoc) は ZMK を v0.3 に固定して
    #   開発しており、Radial Controller のソースが
    #       zmk_endpoints_selected()
    #   を呼ぶ。この関数は本家 ZMK の #3140 (2026-02-12) で
    #       zmk_endpoint_get_selected()
    #   へ改名されたため、v0.4 系のこちらではビルドが落ちる。
    #   fork はその1行だけを直したもの (353a2196 + 1コミット)。
    #   上流が v0.4 へ移ったら remote を sekigon-gonnoc に戻して fork を捨てる。
    #   パッチの実体は tools/hires-dial-zmk-main.patch。
    - name: zmk-driver-hires-dial
      remote: Daytona0306
      revision: zmk-main-endpoints
    - name: zmk-feature-cdc-acm-bootloader-trigger
      remote: sekigon-gonnoc
      revision: main
    - name: zmk-feature-non-lipo-battery-management
      remote: sekigon-gonnoc
      revision: main
    # 4方向スイッチの kscan ドライバ。本家にはスニペットもあるがこちらには無い。
    # CONFIG_ZMK_KSCAN_4_DIRECTION_SWITCH_DRIVER は default y だが
    # depends on DT_HAS_ZMK_KSCAN_4_DIRECTION_SWITCH_ENABLED のため、
    # 対応する DT ノードが無い現状では n のまま。
    - name: zmk-driver-kscan-4-direction-switch
      remote: sekigon-gonnoc
      revision: master

    # ── DYA Studio 基盤 ─────────────────────────────────────────
    # custom-settings は設定の永続化レイヤで、runtime-* 系がこの上に乗る。
    - name: zmk-feature-custom-settings
      remote: cormoran
      revision: main
    - name: zmk-module-ble-management
      remote: cormoran
      revision: main
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: main
    # shield の torabo_tsuki_lp.dtsi が
    # <behaviors/battery_history_request.dtsi> を include しているため、
    # 機能を使わなくてもモジュール自体は必要 (CONFIG は既定の n のまま)。
    - name: zmk-module-battery-history
      remote: cormoran
      revision: main

    # ── マクロ / コンボのランタイム編集 ─────────────────────────
    # DYA Studio の「マクロ&コンボ」タブから編集できるようになる。
    - name: zmk-feature-runtime-combo
      remote: cormoran
      revision: main
    - name: zmk-feature-runtime-macro
      remote: cormoran
      revision: main

    # ── DYA Studio の診断タブ ───────────────────────────────────
    # キースイッチ (押下統計・チャタリング検出)
    - name: zmk-feature-kscan-diagnostics
      remote: cormoran
      revision: main
    # キースイッチ診断のライブ表示 (kscan-diagnostics の推奨依存)
    - name: zmk-feature-input-stream
      remote: cormoran
      revision: main
    # 安定性 (フリーズ・ハードフォルト・予期しないリセットを記録)
    - name: zmk-feature-watchdog
      remote: cormoran
      revision: main
    # デバイス情報 (ビルド / ハードウェア / ランタイムの詳細)
    - name: zmk-feature-device-info
      remote: cormoran
      revision: main
    # スタック使用量など開発者向けツール
    - name: zmk-module-devtool
      remote: cormoran
      revision: main
    # Zephyr settings の閲覧
    - name: zmk-feature-zephyr-setting-expose
      remote: cormoran
      revision: main
    # Studio RPC の性能計測
    - name: zmk-feature-studio-rpc-perf
      remote: cormoran
      revision: main

    # ── 接続先 / OS ごとのデフォルトレイヤー ───────────────────
    # DYA Studio の「OS ごとのデフォルトレイヤー」パネルの実体。
    # USB / BLE プロファイルごと、および検出した OS ごとに
    # ベースレイヤーを割り当てられる。
    # NOTE: main ブランチには custom Studio RPC が入っておらず Studio の
    #       パネルから操作できないため codex/custom-rpc-rewrite を使う。
    - name: zmk-feature-default-layer
      remote: cormoran
      revision: codex/custom-rpc-rewrite
    # OS 判定。default-layer の OS 連動に必要。
    - name: zmk-feature-os-detection
      remote: cormoran
      revision: main

    # ── スクロール / ジェスチャー ───────────────────────────────
    - name: zmk-scroll-snap
      remote: kot149
      revision: v1
    # kot149/v1 の上に7コミット。ZMK v0.4 の endpoints API 改名対応と、
    # ジェスチャー入力中にカーソルが動くのを抑制する機能が入っている。
    # DT プロパティと Kconfig は kot149/v1 から変わっておらず
    # gestures.dtsi はそのまま使える (抑制は実行時に自動で効く)。
    - name: zmk-mouse-gesture
      remote: shakushakupanda
      revision: suppress-cursor-while-active
    # ジェスチャーを Flash に保存し Web UI / Studio から編集できるようにする。
    # 書き換え対象は DT インスタンス0番のみ (DEVICE_DT_GET(DT_DRV_INST(0))) なので、
    # gestures.dtsi の6プロセッサ (レイヤー連動・個別チューニング) はそのまま残る。
    # そのため RPC 用の mg ノードを right.overlay の先頭側で定義し0番を取らせている。
    - name: zmk-module-mouse-gesture-rpc
      remote: shakushakupanda
      revision: main
    - name: zmk-listeners
      remote: ssbb
      revision: v1
    - name: zmk-input-processor-scroll-inertia
      remote: mjmjm0101
      revision: main

    # ── LED (BMP Boost LED Extender) ────────────────────────────
    # 3色LED を叩くウィジェット。snippets/led-plus が使う。
    # sekigon の zmk-feature-status-led は binding の led が単数 phandle で
    # 3色を扱えないため、LED Extender 側はこちらに任せる。
    # moNa2 では rgbled_adapter シールド経由で同じモジュールを使っている。
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: main
  self:
    path: config
