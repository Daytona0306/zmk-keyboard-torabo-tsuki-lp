    # kot149/v1 の上に7コミット。ZMK v0.4 の endpoints API 改名対応と、
    # ジェスチャー入力中にカーソルが動くのを抑制する機能が入っている。
    # DT プロパティと Kconfig は kot149/v1 から変わっておらず
    # gestures.dtsi はそのまま使える (抑制は実行時に自動で効く)。
    - name: zmk-mouse-gesture
      remote: shakushakupanda
      revision: 10597a47ed60b5f7c07710a0eeff7f7cb9576a1e  # track: suppress-cursor-while-active
    # ジェスチャーを Flash に保存し Web UI / Studio から編集できるようにする。
    # 書き換え対象は DT インスタンス0番のみ (DEVICE_DT_GET(DT_DRV_INST(0))) なので、
    # gestures.dtsi の6プロセッサ (レイヤー連動・個別チューニング) はそのまま残る。
    # そのため RPC 用の mg ノードを right.overlay の先頭側で定義し0番を取らせている。
    - name: zmk-module-mouse-gesture-rpc
